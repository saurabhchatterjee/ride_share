services:
  postgres:
    image: 'postgres:latest'
    container_name: POSTGRES_DB
    environment:
      - 'POSTGRES_DB=ride-share'
      - 'POSTGRES_PASSWORD=dev-POSTGRES_PASSWORD'
      - 'POSTGRES_USER=dev-POSTGRES_USER'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
